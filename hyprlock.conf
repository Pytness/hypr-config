general {
  hide_cursor = true
}

background {
    monitor = DP-1
    path = screenshot
    blur_passes = 3
    blur_size = 10
}


# DATE
label {
  monitor = DP-1
  text = cmd[update:43200000] date +"%D"
  color = $text
  font_size = 300
  font_family = CaskaydiaCove Nerd Font
  position = 0, -300
  halign = center
  valign = top
}

shape {
  monitor = DP-1
  size = 80%, 2
  color = rgba(255, 255, 255, 1)
  position = 0, -750
  halign = center
  valign = top
}


# TIME
label {
  monitor = DP-1
  text = cmd[update:1000] date +"%T"
  color = $text
  font_size = 200
  font_family = CaskaydiaCove Nerd Font
  position = 0, -750
  halign = center
  valign = top
}


# INPUT FIELD
input-field {
  monitor = DP-1
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span ><i>󰌾 Logged in as </i>$USER</span>
  hide_input = false
  check_color = $accent
  rounding = 10
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}
